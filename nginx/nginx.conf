events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # Increase buffer sizes for large API responses (admin pages, exports)
    proxy_buffer_size          16k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;

    server {
        listen 80;

        # ---------------------------------------------------------------
        # API — strip /api prefix and proxy to the FastAPI backend
        # ---------------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend:8000/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Allow longer timeouts for payment and SMM panel calls
            proxy_read_timeout    120s;
            proxy_connect_timeout  15s;
            proxy_send_timeout     60s;

            # Required for Stripe/Razorpay webhooks — raw body must reach FastAPI
            proxy_request_buffering off;
        }

        # ---------------------------------------------------------------
        # Frontend — React SPA served by the frontend nginx container
        # ---------------------------------------------------------------
        location / {
            proxy_pass         http://frontend:80/;
            proxy_http_version 1.1;

            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
