services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # These override whatever is in backend/.env so Docker service names resolve
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json').read()"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  # ── Frontend (React SPA via nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    # Ports only needed for direct/Tailscale access + local dev. Public traffic
    # arrives through the Cloudflare Tunnel (cloudflared → nginx:80), so these can
    # be removed once the tunnel is verified.
    ports:
      - "80:80"
      - "3001:3001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  # ── Cloudflare Tunnel ───────────────────────────────────────────────────────
  # Exposes the site publicly without a public IP / port-forwarding. cloudflared
  # makes an outbound connection to Cloudflare; the tunnel's public-hostname
  # ingress (configured in the Zero Trust dashboard) forwards each domain to
  # http://nginx:80. The Host header is preserved, so the SPA routes by hostname
  # (buyrealviews → Views, buyrealsubscribers → Subscribers, glowapex → portal).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  mongo_data:
  redis_data:
